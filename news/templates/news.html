  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<div class="container mt-4">
    <h1 class="mb-4">Noticias</h1>

    <!-- Un solo ciclo for para recorrer la lista de noticias -->
    {% for news in newss %}
        <!-- Card horizontal para cada noticia -->
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">{{ news.headline }}</h5>
                        <p class="card-text">{{ news.body }}</p>
                        <p class="card-text"><small class="text-muted">{{ news.date }}</small></p>
                    </div>
                </div>
            </div>
        </div>
    {% empty %}
        <p class="text-muted">No hay noticias registradas.</p>
    {% endfor %}
</div>
